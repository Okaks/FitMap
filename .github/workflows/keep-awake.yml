name: Keep apps awake

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ping FitMap
        continue-on-error: true
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-redirs 3 --max-time 60 \
            -A "Mozilla/5.0 (compatible; keepalive)" \
            https://fitmap.streamlit.app/ || echo "no-response")
          echo "FitMap responded: $code"

      - name: Ping Layover
        continue-on-error: true
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-redirs 3 --max-time 60 \
            -A "Mozilla/5.0 (compatible; keepalive)" \
            https://layover.streamlit.app/ || echo "no-response")
          echo "Layover responded: $code"